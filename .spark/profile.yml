version: 1

areas:
  - id: interactive-control-plane
    paths:
      - "cmd/stint/**"
      - "internal/config/**"
      - "internal/local/**"
      - "internal/core/**"
      - "internal/router/**"
    criticality: high
    owners:
      - "@Marguelgtz"
    expected_evidence:
      - go-vet
      - unit-tests

  - id: vast-compute-provider
    paths:
      - "internal/provider/vast/**"
    criticality: high
    owners:
      - "@Marguelgtz"
    expected_evidence:
      - go-vet
      - unit-tests

  - id: model-runtime
    paths:
      - "internal/runtime/llama/**"
    criticality: high
    owners:
      - "@Marguelgtz"
    expected_evidence:
      - go-vet
      - unit-tests

  - id: spark-collaboration
    paths:
      - "internal/spark/**"
      - "internal/collaboration/**"
    criticality: high
    owners:
      - "@Marguelgtz"
    expected_evidence:
      - spark-profile
      - go-vet
      - unit-tests

  - id: fallback-inference
    paths:
      - "internal/provider/cloudflare/**"
    criticality: medium
    owners:
      - "@Marguelgtz"
    expected_evidence:
      - go-vet
      - unit-tests

  - id: release-and-automation
    paths:
      - ".github/workflows/**"
      - ".spark/profile.yml"
      - "go.mod"
      - "Makefile"
      - "stint.config.example.yaml"
    criticality: high
    owners:
      - "@Marguelgtz"
    expected_evidence:
      - spark-profile
      - go-vet
      - unit-tests

  - id: developer-documentation
    paths:
      - "docs/**"
      - "README.md"
    criticality: low
    owners:
      - "@Marguelgtz"
    expected_evidence:
      - spark-profile
