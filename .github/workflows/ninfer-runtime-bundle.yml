name: Build NInfer Runtime Bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-smoke:
    name: Build SM89 release candidate and smoke on clean Vast image
    # The exact Vast base image occupies more than 23 GiB unpacked. The job is
    # intentionally routed to a trusted, disposable runner with adequate disk.
    runs-on: [self-hosted, linux, x64, stint-ninfer-runtime-build]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require main and sufficient runner space
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          available_gib="$(df -BG --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -dc '0-9')"
          test "$available_gib" -ge 35 || { echo "need at least 35 GiB free, got ${available_gib} GiB" >&2; exit 1; }
          df -h "$RUNNER_TEMP"

      - name: Test bundle packaging and unsafe-archive rejection
        run: python3 scripts/test_ninfer_runtime_bundle.py

      - name: Build, package, and clean-image smoke
        run: bash scripts/build_ninfer_runtime_bundle.sh "$RUNNER_TEMP/ninfer-runtime"

      - name: Record candidate archive digest
        shell: bash
        run: |
          set -euo pipefail
          archives=("$RUNNER_TEMP"/ninfer-runtime/*.tar.gz)
          test "${#archives[@]}" -eq 1
          digest="$(sha256sum "${archives[0]}" | awk '{print $1}')"
          {
            echo "## NInfer runtime release candidate"
            echo
            echo "- Stint build SHA: \`$GITHUB_SHA\`"
            echo "- Bundle SHA-256: \`$digest\`"
            echo "- Source run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable-release candidate assets
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-runtime-bundle-81b68a20-sm89
          path: ${{ runner.temp }}/ninfer-runtime/*
          if-no-files-found: error
          retention-days: 30

      - name: Stage verified candidate as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ninfer-runtime/stint-ninfer-81b68a20-sm89-linux-amd64.tar.gz"
          checksum="$archive.sha256"
          manifest="$RUNNER_TEMP/ninfer-runtime/manifest.json"
          digest="$(sha256sum "$archive" | awk '{print $1}')"
          cat > "$RUNNER_TEMP/ninfer-runtime-release-notes.md" <<EOF
          Stint's verified Linux x86-64 NInfer server bundle for RTX 4090 / SM89.

          The attached manifest records the exact NInfer source commit, Qwen NInfer v2 artifact revision and SHA-256, CUDA floor, and immutable Vast base-image digest. The `.sha256` sidecar covers the archive. This bundle passed build and clean-base CLI/dependency smoke checks on the recorded base image. GPU model-loading and performance qualification are tracked separately; publishing does not promote the release path to the default startup strategy.

          Candidate build workflow run: $GITHUB_RUN_ID
          Candidate Stint commit: $GITHUB_SHA
          Candidate bundle SHA-256: $digest
          EOF
          gh release create ninfer-runtime-81b68a20-sm89 \
            "$archive" "$checksum" "$manifest" \
            --draft --title 'Stint NInfer runtime 81b68a20 SM89' \
            --notes-file "$RUNNER_TEMP/ninfer-runtime-release-notes.md" \
            --target "$GITHUB_SHA"

      - name: Verify staged draft release provenance and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ninfer-runtime/stint-ninfer-81b68a20-sm89-linux-amd64.tar.gz"
          digest="$(sha256sum "$archive" | awk '{print $1}')"
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/ninfer-runtime-81b68a20-sm89")"
          test "$(jq -r .draft <<<"$draft")" = true
          test "$(jq -r .target_commitish <<<"$draft")" = "$GITHUB_SHA"
          jq -e --arg run "Candidate build workflow run: $GITHUB_RUN_ID" \
            --arg sha "Candidate Stint commit: $GITHUB_SHA" \
            --arg digest "Candidate bundle SHA-256: $digest" \
            '.body | contains($run) and contains($sha) and contains($digest)' \
            <<<"$draft" >/dev/null
          test "$(jq '.assets | length' <<<"$draft")" -eq 3
          for name in \
            stint-ninfer-81b68a20-sm89-linux-amd64.tar.gz \
            stint-ninfer-81b68a20-sm89-linux-amd64.tar.gz.sha256 \
            manifest.json; do
            jq -e --arg name "$name" '.assets[] | select(.name == $name)' <<<"$draft" >/dev/null
          done
