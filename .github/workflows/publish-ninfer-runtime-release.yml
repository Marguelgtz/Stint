name: Publish NInfer Runtime Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful SM89 release-candidate build workflow run on main
        required: true
        type: string
      immutable_release_enabled_confirmed:
        description: Confirm the repository has immutable releases enabled
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-ninfer-runtime-81b68a20-sm89
  cancel-in-progress: false

jobs:
  publish:
    name: Verify pinned candidate and publish once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source workflow run and Stint lineage
        id: source
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          IMMUTABLE_RELEASE_ENABLED_CONFIRMED: ${{ inputs.immutable_release_enabled_confirmed }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$IMMUTABLE_RELEASE_ENABLED_CONFIRMED" = true || {
            echo "repository immutable-release status must be confirmed before dispatch" >&2
            exit 1
          }
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo "build_run_id must be numeric" >&2; exit 1; }

          # Public run metadata is readable without Actions permission. The
          # workflow token is intentionally limited to the Contents API.
          run_json="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          test "$(jq -r .id <<<"$run_json")" = "$BUILD_RUN_ID"
          test "$(jq -r .path <<<"$run_json")" = .github/workflows/ninfer-runtime-bundle.yml
          test "$(jq -r .event <<<"$run_json")" = workflow_dispatch
          test "$(jq -r .head_branch <<<"$run_json")" = main
          test "$(jq -r .head_repository.full_name <<<"$run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .conclusion <<<"$run_json")" = success
          build_sha="$(jq -r .head_sha <<<"$run_json")"
          git merge-base --is-ancestor "$build_sha" "$GITHUB_SHA"
          changed_files="$(git diff --name-only "$build_sha" "$GITHUB_SHA")"
          if [ -n "$changed_files" ]; then
            while IFS= read -r path; do
              case "$path" in
                cmd/stint/runtime.go|cmd/stint/runtime_test.go|internal/session/startup_events_test.go|.github/workflows/ninfer-runtime-bundle.yml|.github/workflows/publish-ninfer-runtime-release.yml) ;;
                *) echo "unexpected changes after candidate build: $path" >&2; exit 1 ;;
              esac
            done <<< "$changed_files"
          fi
          bundle_sha="$(sed -nE 's/^[[:space:]]*ninferRuntimeBundleSHA256[[:space:]]*=[[:space:]]*"([0-9a-f]{64})".*/\1/p' cmd/stint/runtime.go)"
          test "${#bundle_sha}" -eq 64 || { echo "Stint must pin the exact immutable runtime bundle SHA-256" >&2; exit 1; }
          echo "build_sha=$build_sha" >> "$GITHUB_OUTPUT"
          echo "bundle_sha=$bundle_sha" >> "$GITHUB_OUTPUT"

      - name: Verify staged draft provenance and download its assets
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
          EXPECTED_BUNDLE_SHA256: ${{ steps.source.outputs.bundle_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag=ninfer-runtime-81b68a20-sm89
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          test "$(jq -r .draft <<<"$draft")" = true
          test "$(jq -r .tag_name <<<"$draft")" = "$tag"
          test "$(jq -r .target_commitish <<<"$draft")" = "$BUILD_SHA"
          jq -e --arg run "Candidate build workflow run: $BUILD_RUN_ID" \
            --arg sha "Candidate Stint commit: $BUILD_SHA" \
            --arg digest "Candidate bundle SHA-256: $EXPECTED_BUNDLE_SHA256" \
            '.body | contains($run) and contains($sha) and contains($digest)' \
            <<<"$draft" >/dev/null
          test "$(jq '.assets | length' <<<"$draft")" -eq 3
          for name in \
            stint-ninfer-81b68a20-sm89-linux-amd64.tar.gz \
            stint-ninfer-81b68a20-sm89-linux-amd64.tar.gz.sha256 \
            manifest.json; do
            jq -e --arg name "$name" '.assets[] | select(.name == $name)' <<<"$draft" >/dev/null
          done
          mkdir -p dist/ninfer-runtime
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist/ninfer-runtime

      - name: Verify archive, Stint SHA pin, sidecar, and compatibility tuple
        env:
          EXPECTED_BUNDLE_SHA256: ${{ steps.source.outputs.bundle_sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            stint-ninfer-81b68a20-sm89-linux-amd64.tar.gz
            stint-ninfer-81b68a20-sm89-linux-amd64.tar.gz.sha256
            manifest.json
          )
          actual=(dist/ninfer-runtime/*)
          test "${#actual[@]}" -eq "${#expected[@]}"
          for name in "${expected[@]}"; do test -f "dist/ninfer-runtime/$name"; done
          python3 scripts/ninfer_runtime_bundle.py verify \
            --archive dist/ninfer-runtime/"${expected[0]}" \
            --checksum dist/ninfer-runtime/"${expected[1]}" \
            --manifest dist/ninfer-runtime/"${expected[2]}" \
            --expected-sha256 "$EXPECTED_BUNDLE_SHA256"

      - name: Publish once and verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=ninfer-runtime-81b68a20-sm89
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          test "$(jq -r .draft <<<"$release")" = true
          release_id="$(jq -r .id <<<"$release")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input - <<<'{"draft":false}'
          published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          test "$(jq -r .draft <<<"$published")" = false
          test "$(jq -r .immutable <<<"$published")" = true
          echo "Published immutable release $tag"
