name: CI

on:
  push:
  pull_request:

jobs:
  spark-profile:
    name: spark-profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Spark profile exists
        run: test -s .spark/profile.yml
      - name: Verify profile maps Stint's high-risk surfaces
        run: |
          grep -q 'id: vast-compute-provider' .spark/profile.yml
          grep -q 'id: model-runtime' .spark/profile.yml
          grep -q 'id: spark-collaboration' .spark/profile.yml

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [spark-profile, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
