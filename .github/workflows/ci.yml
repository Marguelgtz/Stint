name: Stint CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spark-profile:
    name: spark-profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate Spark profile exists and tracks Go paths
        shell: bash
        run: |
          test -f .spark/profile.yml
          grep -q 'cmd/stint/\*\*' .spark/profile.yml
          grep -q 'internal/session/\*\*' .spark/profile.yml
          grep -q 'internal/provider/vast/\*\*' .spark/profile.yml
          grep -q 'internal/deep/\*\*' .spark/profile.yml
          grep -q 'internal/deepdashboard/\*\*' .spark/profile.yml
          grep -q 'scripts/\*\*' .spark/profile.yml
          grep -q 'images/ninfer/\*\*' .spark/profile.yml
          grep -q 'go-vet' .spark/profile.yml
          grep -q 'race-tests' .spark/profile.yml

  go-vet:
    name: go-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: Test on-box GitHub publisher safety gates
        run: python3 scripts/test_onbox_github_publish.py
      - name: Test on-box supervisor completion archive gate
        run: bash scripts/test_onbox_supervisor.sh
      - name: Test Deep Work observer pinning and log redaction
        run: |
          python3 scripts/test_onbox_ninfer_observe.py
          python3 scripts/test_deep_agent_log_tail.py
          bash scripts/test_box_phase_setup.sh
          python3 scripts/test_onbox_r2_archive.py
      - name: Test fresh-box smoke CLI preflight without provider mutation
        run: bash scripts/test_onbox_smoke_preflight.sh
      - name: Test Deep Work GPU smoke cost and candidate preflight
        run: bash scripts/test_deep_compression_smoke_preflight.sh
      - name: Test NInfer runtime bundle packaging and archive safety
        run: python3 scripts/test_ninfer_runtime_bundle.py
      - name: Checkout GitHub synthetic merge tree
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - name: Test GitHub synthetic merge tree
        if: github.event_name == 'pull_request'
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          python3 scripts/test_onbox_github_publish.py
          bash scripts/test_onbox_supervisor.sh
          python3 scripts/test_onbox_ninfer_observe.py
          python3 scripts/test_deep_agent_log_tail.py
          bash scripts/test_box_phase_setup.sh
          python3 scripts/test_onbox_r2_archive.py
          bash scripts/test_onbox_smoke_preflight.sh
          bash scripts/test_deep_compression_smoke_preflight.sh
          python3 scripts/test_ninfer_runtime_bundle.py

  race-tests:
    name: race-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...

  build-check:
    name: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Build CLI binary
        run: go build -o /tmp/stint ./cmd/stint
