name: Stint CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spark-profile:
    name: spark-profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Spark profile exists and tracks Go paths
        shell: bash
        run: |
          test -f .spark/profile.yml
          grep -q 'cmd/stint/\*\*' .spark/profile.yml
          grep -q 'internal/session/\*\*' .spark/profile.yml
          grep -q 'internal/provider/vast/\*\*' .spark/profile.yml
          grep -q 'go-vet' .spark/profile.yml
          grep -q 'race-tests' .spark/profile.yml

  go-vet:
    name: go-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...

  race-tests:
    name: race-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...

  build-check:
    name: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Build CLI binary
        run: go build -o /tmp/stint ./cmd/stint
